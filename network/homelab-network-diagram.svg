<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" width="1500" height="980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1500" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="62" font-size="26" font-weight="700" fill="#0f172a">Homelab SOC · Network Architecture</text>
  <text x="60" y="90" font-size="14" fill="#64748b">Two-node Proxmox VE · OPNsense gateway · Suricata IDS · Wazuh SIEM</text>

  <!-- Internet -->
  <rect x="660" y="110" width="180" height="48" rx="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="750" y="140" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Internet</text>
  <line x1="750" y1="158" x2="750" y2="200" stroke="#64748b" stroke-width="2"/>

  <!-- Home router -->
  <rect x="640" y="200" width="220" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="224" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Home router</text>
  <text x="750" y="243" font-size="12" fill="#64748b" text-anchor="middle">10.0.0.1 · upstream gateway</text>
  <line x1="750" y1="256" x2="750" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- Admin laptop -->
  <rect x="1180" y="192" width="260" height="62" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1310" y="217" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Admin laptop</text>
  <text x="1310" y="237" font-size="12" fill="#6d28d9" text-anchor="middle">Tailscale → Proxmox UI, Wazuh, SSH</text>
  <line x1="1310" y1="254" x2="1310" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- Home LAN bar -->
  <rect x="60" y="300" width="1380" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="750" y="322" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Home network · 10.0.0.0/24 · treated as untrusted WAN</text>

  <!-- Uplinks from nodes -->
  <line x1="370" y1="334" x2="370" y2="420" stroke="#64748b" stroke-width="2"/>
  <line x1="1130" y1="334" x2="1130" y2="420" stroke="#64748b" stroke-width="2"/>

  <!-- ===================== NODE 2 (pve02) ===================== -->
  <rect x="60" y="360" width="620" height="500" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="388" font-size="16" font-weight="700" fill="#0f172a">pve02 · Node 2 — Gateway &amp; Attacker</text>
  <text x="84" y="407" font-size="11.5" fill="#64748b">HP EliteDesk 705 G5 Mini · Proxmox VE</text>

  <!-- vmbr0 -->
  <rect x="90" y="420" width="560" height="28" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="370" y="439" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">vmbr0 · physical NIC · 10.0.0.129</text>
  <line x1="205" y1="448" x2="205" y2="487" stroke="#64748b" stroke-width="2"/>

  <!-- OPNsense -->
  <rect x="90" y="475" width="560" height="150" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <!-- WAN pill -->
  <rect x="105" y="487" width="200" height="38" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="205" y="503" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">WAN · vtnet0</text>
  <text x="205" y="518" font-size="11" fill="#475569" text-anchor="middle">10.0.0.89 · DHCP</text>
  <!-- Title -->
  <text x="325" y="503" font-size="16" font-weight="700" fill="#9a3412">OPNsense · fw01</text>
  <text x="325" y="521" font-size="12" fill="#64748b">Firewall · Router · DNS · DHCP</text>
  <text x="110" y="551" font-size="12" fill="#1f2937"><tspan font-weight="700" fill="#9a3412">Suricata IDS</tspan> · PCAP live mode · ET Open rules · inspects LAN + LABNET</text>
  <!-- LAN pill -->
  <rect x="105" y="573" width="255" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="232" y="590" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">LAN · vtnet1</text>
  <text x="232" y="605" font-size="11" fill="#7f1d1d" text-anchor="middle">192.168.10.1/24</text>
  <!-- LABNET pill -->
  <rect x="380" y="573" width="255" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="507" y="590" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">LABNET · vtnet2</text>
  <text x="507" y="605" font-size="11" fill="#1e3a8a" text-anchor="middle">192.168.100.1/24 · MTU 1450</text>

  <!-- links down to bridges -->
  <line x1="232" y1="613" x2="232" y2="655" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="507" y1="613" x2="507" y2="655" stroke="#2563eb" stroke-width="2.5"/>

  <!-- vmbr1 -->
  <rect x="105" y="655" width="255" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="232" y="675" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">vmbr1 · internal only</text>
  <!-- labnet (node 2 side) -->
  <rect x="380" y="655" width="270" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="515" y="675" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">labnet · SDN VXLAN</text>

  <!-- Kali -->
  <line x1="232" y1="685" x2="232" y2="720" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="105" y="720" width="255" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="122" y="748" font-size="15" font-weight="700" fill="#1f2937">Kali Linux</text>
  <text x="122" y="770" font-size="12" fill="#475569">Attacker VM</text>
  <text x="122" y="790" font-size="12" fill="#475569">192.168.10.102 (DHCP)</text>
  <text x="122" y="810" font-size="12" fill="#475569">Traffic to lab crosses fw01</text>

  <!-- Bridges note -->
  <rect x="380" y="720" width="270" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="397" y="748" font-size="13" font-weight="700" fill="#334155">Bridges</text>
  <text x="397" y="770" font-size="12" fill="#475569">vmbr0 — uplink to home LAN</text>
  <text x="397" y="790" font-size="12" fill="#475569">vmbr1 — internal, no physical port</text>
  <text x="397" y="810" font-size="12" fill="#475569">labnet — SDN VNet across nodes</text>

  <!-- ===================== NODE 1 (pve) ===================== -->
  <rect x="820" y="360" width="620" height="500" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="844" y="388" font-size="16" font-weight="700" fill="#0f172a">pve · Node 1 — Defender &amp; Targets</text>
  <text x="844" y="407" font-size="11.5" fill="#64748b">HP EliteDesk 705 G5 Mini · Proxmox VE</text>

  <!-- vmbr0 -->
  <rect x="850" y="420" width="560" height="28" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="1130" y="439" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">vmbr0 · physical NIC · 10.0.0.53 · VXLAN underlay</text>

  <!-- Wazuh -->
  <rect x="850" y="475" width="270" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="867" y="502" font-size="16" font-weight="700" fill="#1e3a8a">Wazuh SIEM</text>
  <text x="867" y="521" font-size="12" fill="#64748b">Manager · Indexer · Dashboard</text>
  <text x="867" y="545" font-size="12" fill="#475569">192.168.100.20 (static)</text>
  <text x="867" y="565" font-size="12" fill="#475569">Syslog listener · UDP 514</text>
  <text x="867" y="585" font-size="12" fill="#475569">Custom Suricata JSON decoder</text>
  <text x="867" y="605" font-size="12" fill="#475569">Tailscale for remote access</text>

  <!-- Targets (planned) -->
  <rect x="1140" y="475" width="270" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1157" y="502" font-size="16" font-weight="700" fill="#1f2937">Target VMs</text>
  <text x="1157" y="521" font-size="12" fill="#64748b">Intentionally vulnerable</text>
  <text x="1157" y="545" font-size="12" fill="#475569">Metasploitable</text>
  <text x="1157" y="565" font-size="12" fill="#475569">DVWA</text>
  <text x="1157" y="585" font-size="12" fill="#475569">192.168.100.0/24</text>
  <text x="1157" y="605" font-size="12" font-style="italic" fill="#94a3b8">planned</text>

  <!-- links down to labnet -->
  <line x1="985" y1="625" x2="985" y2="655" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="1275" y1="625" x2="1275" y2="655" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- labnet (node 1 side) -->
  <rect x="850" y="655" width="560" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1130" y="675" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">labnet · SDN VXLAN VNI 100 · 192.168.100.0/24 · gateway .1 = OPNsense</text>

  <!-- Lower row -->
  <rect x="850" y="720" width="270" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="867" y="748" font-size="15" font-weight="700" fill="#1f2937">Active Directory lab</text>
  <text x="867" y="770" font-size="12" fill="#475569">Domain + endpoints for</text>
  <text x="867" y="790" font-size="12" fill="#475569">Windows detection practice</text>
  <text x="867" y="810" font-size="12" font-style="italic" fill="#94a3b8">planned</text>

  <rect x="1140" y="720" width="270" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1157" y="748" font-size="13" font-weight="700" fill="#334155">Wazuh agents</text>
  <text x="1157" y="770" font-size="12" fill="#475569">pve02 host → Wazuh</text>
  <text x="1157" y="790" font-size="12" fill="#475569">Auth, sshd and PAM events</text>
  <text x="1157" y="810" font-size="12" fill="#475569">alongside network alerts</text>

  <!-- ===================== Cross-node links ===================== -->
  <!-- VXLAN -->
  <line x1="650" y1="670" x2="850" y2="670" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="750" y="648" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">VXLAN tunnel</text>
  <text x="750" y="702" font-size="11" fill="#1e3a8a" text-anchor="middle">UDP 4789 over</text>
  <text x="750" y="716" font-size="11" fill="#1e3a8a" text-anchor="middle">home LAN</text>

  <!-- Syslog flow -->
  <line x1="650" y1="540" x2="846" y2="540" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowAmber)"/>
  <text x="750" y="528" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Syslog · UDP 514</text>
  <text x="750" y="560" font-size="11" fill="#92400e" text-anchor="middle">Suricata alerts</text>
  <text x="750" y="574" font-size="11" fill="#92400e" text-anchor="middle">+ firewall logs</text>

  <!-- ===================== Legend ===================== -->
  <line x1="60" y1="895" x2="1440" y2="895" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="922" x2="92" y2="922" stroke="#64748b" stroke-width="3"/>
  <text x="100" y="926" font-size="12" fill="#334155">Home LAN / WAN · 10.0.0.0/24</text>

  <line x1="330" y1="922" x2="362" y2="922" stroke="#dc2626" stroke-width="3"/>
  <text x="370" y="926" font-size="12" fill="#334155">Attacker LAN · 192.168.10.0/24</text>

  <line x1="610" y1="922" x2="642" y2="922" stroke="#2563eb" stroke-width="3"/>
  <text x="650" y="926" font-size="12" fill="#334155">LABNET · 192.168.100.0/24</text>

  <line x1="860" y1="922" x2="892" y2="922" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <text x="904" y="926" font-size="12" fill="#334155">Log flow to Wazuh</text>

  <rect x="1060" y="913" width="30" height="18" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1098" y="926" font-size="12" fill="#334155">Planned</text>

  <text x="60" y="958" font-size="11.5" fill="#94a3b8">Hardware: 2× HP EliteDesk 705 G5 Mini · Ryzen 5 Pro 3400G · 16 GB RAM · 256 GB NVMe each</text>
</svg>
